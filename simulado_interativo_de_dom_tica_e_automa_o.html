                    </div>
                    <div class="bg-emerald-950/60 border border-emerald-800/70 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span class="text-xs text-emerald-300">Acertos:</span>
                        <span id="stat-correct" class="text-sm font-bold text-emerald-400">0</span>
                    </div>
                    <div class="bg-rose-950/60 border border-rose-800/70 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-rose-400"></span>
                        <span class="text-xs text-rose-300">Erros:</span>
                        <span id="stat-wrong" class="text-sm font-bold text-rose-400">0</span>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                        <span class="text-xs text-slate-400">Nota:</span>
                        <span id="stat-percent" class="text-sm font-bold text-amber-400">0%</span>
                    </div>
                    <button onclick="resetQuiz()" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition shadow-sm cursor-pointer">
                        Reiniciar Simulado
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- Navigation Tabs -->
            <div class="flex items-center gap-1.5 mt-3 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="setFilter('all')" id="tab-all" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap bg-blue-600 text-white">
                    Todas (80)
                </button>
                <button onclick="setFilter(1)" id="tab-1" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700">

        </div>

                card.className = `bg-slate-800/90 border rounded-xl p-4 sm:p-5 transition shadow-md ${
                    !answered ? 'border-slate-700/80' : isCorrect ? 'border-emerald-600/80 bg-emerald-950/10' : 'border-rose-600/80 bg-rose-950/10'
                }`;

                const letters = ['a', 'b', 'c', 'd', 'e'];

                let optionsHtml = item.options.map((optText, idx) => {
                    let btnStyle = "bg-slate-900/70 hover:bg-slate-700/80 border-slate-700 text-slate-200";
                    let badgeStyle = "bg-slate-800 text-slate-400 border-slate-600";
                    let statusIcon = "";

                    if (answered) {
                        if (idx === item.correct) {
                            btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-medium";
                            badgeStyle = "bg-emerald-600 text-white border-emerald-500";
                            statusIcon = `<span class="ml-auto text-emerald-400 font-bold text-sm">✓ Correta</span>`;
                        } else if (idx === selectedIdx && idx !== item.correct) {
                            btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200 line-through opacity-90";
                            badgeStyle = "bg-rose-600 text-white border-rose-500";
                            statusIcon = `<span class="ml-auto text-rose-400 font-bold text-sm">✗ Sua escolha</span>`;
                        } else {
                            btnStyle = "bg-slate-900/40 border-slate-800 text-slate-500 opacity-60";
                        }
                    }

                    return `
                        <button
                            onclick="selectAnswer(${item.id}, ${idx})"
                            ${answered ? 'disabled' : ''}
                            class="option-btn w-full text-left p-3 rounded-lg border flex items-center gap-3 cursor-pointer disabled:cursor-default ${btnStyle}"
                        >
                            <span class="w-6 h-6 rounded-md text-xs font-bold flex items-center justify-center border shrink-0 uppercase ${badgeStyle}">
                                ${letters[idx]}
                            </span>
                            <span class="text-sm leading-snug">${optText}</span>
                            ${statusIcon}
                        </button>
                    `;
                }).join('');

                let feedbackHtml = '';
                if (answered) {
                    feedbackHtml = `
                        <div class="mt-3 pt-3 border-t border-slate-700/60 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs">
                            <div>
                                ${isCorrect
                                    ? `<span class="text-emerald-400 font-semibold">✓ Excelente! Resposta correta.</span>`
                                    : `<span class="text-rose-400 font-semibold">✗ Incorreto.</span> <span class="text-slate-300">A resposta certa é: <strong class="text-emerald-300">${letters[item.correct]}) ${item.options[item.correct]}</strong></span>`
                                }
                                ${item.note ? `<p class="text-amber-300/90 mt-1">💡 ${item.note}</p>` : ''}
                            </div>
                            <button onclick="retryQuestion(${item.id})" class="self-start sm:self-auto text-xs text-slate-400 hover:text-white underline shrink-0 cursor-pointer">
                                Tentar novamente
                            </button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-blue-950 text-blue-300 border border-blue-800/60 text-xs font-bold px-2.5 py-0.5 rounded-md">
                                Test ${item.test} • Pregunta ${item.num}
                            </span>
                            <span class="text-xs text-slate-500">#${item.id}</span>
                        </div>
                    </div>
                    <h3 class="text-sm sm:text-base font-semibold text-white mb-3 leading-relaxed">
                        ${item.q}
                    </h3>
                    ${item.svg ? item.svg : ''}
                    <div class="space-y-2">
                        ${optionsHtml}
                    </div>
                    ${feedbackHtml}
                `;

                container.appendChild(card);
            });
        }

        function selectAnswer(questionId, optionIdx) {
            if (userAnswers[questionId] !== undefined) return;
            userAnswers[questionId] = optionIdx;
            updateStats();
            renderQuestions();
        }

        function retryQuestion(questionId) {
            delete userAnswers[questionId];
            updateStats();
            renderQuestions();
        }

        function updateStats() {
            const total = questionsData.length;
            const answeredIds = Object.keys(userAnswers);
            const answeredCount = answeredIds.length;

            let correctCount = 0;
            let wrongCount = 0;

            answeredIds.forEach(id => {
                const q = questionsData.find(item => item.id === Number(id));
                if (q) {
                    if (userAnswers[id] === q.correct) correctCount++;
                    else wrongCount++;
                }
            });

            const percent = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            const progressPercent = Math.round((answeredCount / total) * 100);

            document.getElementById('stat-progress').textContent = `${answeredCount} / ${total}`;
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-wrong').textContent = wrongCount;
            document.getElementById('stat-percent').textContent = `${percent}%`;
            document.getElementById('wrong-tab-count').textContent = wrongCount;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }

        function setFilter(filterVal) {
            currentFilter = filterVal;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer";
            });
            const activeTab = document.getElementById(`tab-${filterVal}`);
            if (activeTab) {
                activeTab.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap bg-blue-600 text-white cursor-pointer";
            }
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetQuiz() {
            userAnswers = {};
            updateStats();
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initial render
        renderQuestions();
    </script>
</body>
</html>
